version: 2

sources:
  - name: tpch_raw
    description: >
      Raw TPC-H benchmark tables generated by scripts/load_tpch.py
      (DuckDB tpch extension, scale factor 0.1). Not modified by dbt.
    database: tpch
    schema: main
    tables:
      - name: orders
        description: One row per customer order.
      - name: lineitem
        description: One row per line within an order; the largest table.
      - name: customer
        description: One row per customer, with market segment and nation.
      - name: supplier
        description: One row per supplier.
      - name: part
        description: One row per part (product).
      - name: partsupp
        description: Which supplier supplies which part, with available quantity and supply cost.
      - name: nation
        description: 25 nations; links customers and suppliers to a region.
      - name: region
        description: 5 world regions.
