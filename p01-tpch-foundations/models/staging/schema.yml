version: 2

models:
  - name: stg_tpch__orders
    description: >
      One row per customer order, renamed from raw TPC-H `orders`.
      No rows are filtered and no columns are derived; marts apply business rules.
    columns:
      - name: order_id
        description: Primary key. Unique identifier of the order (raw `o_orderkey`).
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: >
          The customer who placed the order (raw `o_custkey`). Must exist in
          stg_tpch__customers; a missing customer would drop the order from inner joins
          and leave null customer attributes in left joins.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch__customers')
                field: customer_id

      - name: order_status
        description: >
          Fulfilment status derived from the order's line items: F = every line
          shipped (fulfilled), O = no line shipped yet (open), P = some lines shipped
          and some not (partially shipped). Note that P means partial, not "pending".
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['F', 'O', 'P']
              config:
                severity: warn

      - name: total_price
        description: >
          Order total in the dataset's currency (treated as USD), after line-item
          discounts and including tax. Sum of all line items in the order.
        data_tests:
          - not_null

      - name: order_date
        description: Date the order was placed. TPC-H dates run from 1992-01-01 to 1998-08-02.
        data_tests:
          - not_null

      - name: order_priority
        description: Priority label as text, e.g. '1-URGENT' to '5-LOW'. The leading digit is the rank.

      - name: clerk
        description: Clerk who handled the order, e.g. 'Clerk#000000951'.

      - name: ship_priority
        description: Shipping priority. Always 0 in TPC-H, so not useful for analysis.

      - name: order_comment
        description: Free-text comment generated by TPC-H; no business meaning.

  - name: stg_tpch__customers
    description: One row per customer, renamed from raw TPC-H `customer`.
    columns:
      - name: customer_id
        description: Primary key. Unique identifier of the customer (raw `c_custkey`).
        data_tests:
          - unique
          - not_null

      - name: customer_name
        description: Customer name, e.g. 'Customer#000000001'. Synthetic, not personal data.
        data_tests:
          - not_null

      - name: customer_address
        description: Synthetic street address string.

      - name: nation_id
        description: Nation the customer belongs to; joins to stg_tpch__nation.nation_id.
        data_tests:
          - not_null

      - name: customer_phone
        description: Synthetic phone number; the first two digits encode the nation.

      - name: account_balance
        description: Account balance in the dataset's currency (treated as USD). Can be negative.

      - name: market_segment
        description: >
          One of AUTOMOBILE, BUILDING, FURNITURE, HOUSEHOLD, MACHINERY.
          fct_monthly_revenue groups by this column.

      - name: customer_comment
        description: Free-text comment generated by TPC-H; no business meaning.

  - name: stg_tpch__nation
    description: >
      One row per nation (25 rows), renamed from raw TPC-H `nation` and enriched with
      region_name from the region_codes seed (left join, so no nation is dropped).
    columns:
      - name: nation_id
        description: Primary key (raw `n_nationkey`).
        data_tests:
          - unique
          - not_null
      - name: nation_name
        description: Nation name in upper case, e.g. 'BRAZIL'.
      - name: region_id
        description: Region the nation belongs to; joins to stg_tpch__region.region_id.
      - name: region_name
        description: >
          Region display name in title case (e.g. 'Middle East'), from the region_codes seed.
          not_null here catches a region_id that is missing from the seed, which the left
          join would otherwise turn into a silent null.
        data_tests:
          - not_null
      - name: nation_comment
        description: Free-text comment generated by TPC-H; no business meaning.

  - name: stg_tpch__region
    description: One row per world region (5 rows), renamed from raw TPC-H `region`.
    columns:
      - name: region_id
        description: Primary key (raw `r_regionkey`).
        data_tests:
          - unique
          - not_null
      - name: region_name
        description: Region name in upper case, e.g. 'EUROPE'.
      - name: region_comment
        description: Free-text comment generated by TPC-H; no business meaning.
