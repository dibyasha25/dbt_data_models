version: 2

models:
  - name: stg_tpch__orders
    description: >
      One row per customer order, renamed from raw TPC-H `orders` and enriched with
      priority_label and priority_rank from the order_priority seed (left join).
      No rows are filtered; marts apply business rules.
    columns:
      - name: order_id
        description: Primary key. Unique identifier of the order (raw `o_orderkey`).
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: >
          The customer who placed the order (raw `o_custkey`). Must exist in
          stg_tpch__customers; a missing customer would drop the order from inner joins
          and leave null customer attributes in left joins.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch__customers')
                field: customer_id

      - name: order_status
        description: >
          Fulfilment status derived from the order's line items: F = every line
          shipped (fulfilled), O = no line shipped yet (open), P = some lines shipped
          and some not (partially shipped). Note that P means partial, not "pending".
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['F', 'O', 'P']
              config:
                severity: warn

      - name: total_price
        description: >
          Order total in the dataset's currency (treated as USD), after line-item
          discounts and including tax. Sum of all line items in the order.
        data_tests:
          - not_null

      - name: order_date
        description: Date the order was placed. TPC-H dates run from 1992-01-01 to 1998-08-02.
        data_tests:
          - not_null

      - name: order_priority
        description: >
          Raw priority code as text, e.g. '1-URGENT' to '5-LOW'. Join key to the
          order_priority seed; every code must exist there.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('order_priority')
                field: priority_code

      - name: priority_label
        description: Readable priority from the order_priority seed, e.g. 'Not Specified'.
        data_tests:
          - not_null

      - name: priority_rank
        description: >
          1 (Urgent) to 5 (Low) from the order_priority seed. Use this to sort or filter
          by urgency instead of parsing the text code.
        data_tests:
          - not_null

      - name: clerk
        description: Clerk who handled the order, e.g. 'Clerk#000000951'.

      - name: ship_priority
        description: Shipping priority. Always 0 in TPC-H, so not useful for analysis.

      - name: order_comment
        description: Free-text comment generated by TPC-H; no business meaning.

  - name: stg_tpch__customers
    description: One row per customer, renamed from raw TPC-H `customer`.
    columns:
      - name: customer_id
        description: Primary key. Unique identifier of the customer (raw `c_custkey`).
        data_tests:
          - unique
          - not_null

      - name: customer_name
        description: Customer name, e.g. 'Customer#000000001'. Synthetic, not personal data.
        data_tests:
          - not_null

      - name: customer_address
        description: Synthetic street address string.

      - name: nation_id
        description: Nation the customer belongs to; joins to stg_tpch__nation.nation_id.
        data_tests:
          - not_null

      - name: customer_phone
        description: Synthetic phone number; the first two digits encode the nation.

      - name: account_balance
        description: Account balance in the dataset's currency (treated as USD). Can be negative.

      - name: market_segment
        description: >
          One of AUTOMOBILE, BUILDING, FURNITURE, HOUSEHOLD, MACHINERY.
          fct_monthly_revenue groups by this column.

      - name: customer_comment
        description: Free-text comment generated by TPC-H; no business meaning.

  - name: stg_tpch__nation
    description: >
      One row per nation (25 rows), renamed from raw TPC-H `nation` and enriched with
      region_name from the region_codes seed (left join, so no nation is dropped).
    columns:
      - name: nation_id
        description: Primary key (raw `n_nationkey`).
        data_tests:
          - unique
          - not_null
      - name: nation_name
        description: Nation name in upper case, e.g. 'BRAZIL'.
      - name: region_id
        description: Region the nation belongs to; joins to stg_tpch__region.region_id.
      - name: region_name
        description: >
          Region display name in title case (e.g. 'Middle East'), from the region_codes seed.
          not_null here catches a region_id that is missing from the seed, which the left
          join would otherwise turn into a silent null.
        data_tests:
          - not_null
      - name: nation_comment
        description: Free-text comment generated by TPC-H; no business meaning.

  - name: stg_tpch__region
    description: One row per world region (5 rows), renamed from raw TPC-H `region`.
    columns:
      - name: region_id
        description: Primary key (raw `r_regionkey`).
        data_tests:
          - unique
          - not_null
      - name: region_name
        description: Region name in upper case, e.g. 'EUROPE'.
      - name: region_comment
        description: Free-text comment generated by TPC-H; no business meaning.

  - name: stg_tpch__lineitem
    description: >
      One row per order line (600,572 rows at sf=0.1), renamed from raw TPC-H `lineitem`.
      Natural key is (order_id, line_number); line_item_id is a dbt_utils surrogate key over it.
      Prices are already in dollars, so no cents conversion is applied.
    columns:
      - name: line_item_id
        description: >
          Primary key. md5 hash of order_id + line_number from dbt_utils.generate_surrogate_key.
          Lets a two-column natural key be tested and joined as one column.
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: The order this line belongs to. Must exist in stg_tpch__orders.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch__orders')
                field: order_id

      - name: line_number
        description: Position of the line within its order (1 to 7).
        data_tests:
          - not_null

      - name: part_id
        description: The part (product) on this line; raw `l_partkey`.

      - name: supplier_id
        description: The supplier of the part; raw `l_suppkey`.

      - name: extended_price
        description: >
          quantity x the part's retail price, in dollars (treated as USD), BEFORE discount and tax.
          Already in dollars: do not apply cents_to_dollars. A singular test checks it equals
          the raw value.
        data_tests:
          - not_null

      - name: return_flag
        description: R = returned, A = accepted, N = not yet known.

      - name: line_status
        description: F = shipped (fulfilled), O = not yet shipped (open).

      - name: ship_date
        description: Date the line shipped.

      - name: commit_date
        description: Date the line was promised to ship.

      - name: receipt_date
        description: Date the customer received the line.

      - name: ship_instructions
        description: Free text such as 'DELIVER IN PERSON'.

      - name: ship_mode
        description: Shipping method, e.g. AIR, RAIL, TRUCK.

      - name: line_comment
        description: Free-text comment generated by TPC-H; no business meaning.

      - name: quantity
        description: Units ordered on this line.

      - name: discount
        description: Discount as a fraction (0.04 = 4%), applied to extended_price.

      - name: tax
        description: Tax rate as a fraction (0.02 = 2%), applied after discount.
