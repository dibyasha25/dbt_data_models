name: p01_tpch_foundations
version: "1.0.0"
config-version: 2

# Must match the top-level key in profiles.yml
profile: p01_tpch

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

# Materialization per layer. The trade-off is build compute vs read compute, plus freshness.
# The key under `models:` must be the project `name:` above, or dbt ignores these
# settings and only warns about "unused configuration paths".
models:
  p01_tpch_foundations:
    staging:
      +materialized: view    # light renames + seed lookups; always current, nothing stored
    intermediate:
      +materialized: view    # one join, read by only two marts; cheap to recompute
    marts:
      +materialized: table   # read often by people and BI; pay once at build, fast reads
